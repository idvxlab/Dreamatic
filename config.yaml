# ----------------------------------------------------------------------
# Third-party API configuration
# 361API uses an OpenAI-compatible interface.
# Put keys in .env or system environment variables:
#   THREE_SIX_ONE_API_KEY=sk-...
# Compatible aliases such as BLTCY_API_KEY and OPENAI_API_KEY are also accepted.
# HARNESS_DEFAULT_PROVIDER supports the legacy alias my-361api.
# ----------------------------------------------------------------------

default_provider: openai-hub

providers:
  # Default OpenAI-compatible provider configured through Dreamatic env vars.
  openai-hub:
    name: openai-compatible
    model: "${DREAMATIC_MODEL}"
    api_key: "${DREAMATIC_API_KEY}"
    api_key_env:
      - DREAMATIC_API_KEY
    base_url: "${DREAMATIC_BASE_URL}"
    max_tokens: 4096
    temperature: 0.0

  openai-hub-mini:
    name: openai-compatible
    model: "${DREAMATIC_SUMMARY_MODEL}"
    api_key: "${DREAMATIC_SUMMARY_API_KEY}"
    api_key_env:
      - DREAMATIC_SUMMARY_API_KEY
    base_url: "${DREAMATIC_SUMMARY_BASE_URL}"
    max_tokens: 2048
    temperature: 0.0

  # Primary OpenAI-compatible provider via 361API
  361api-openai:
    name: openai-compatible
    model: gpt-4o
    api_key: "${THREE_SIX_ONE_API_KEY}"
    api_key_env:
      - THREE_SIX_ONE_API_KEY
      - THREESIXONE_API_KEY
      - API_361_KEY
      - 361API_API_KEY
      - OPENAI_API_KEY
      - BLTCY_API_KEY
    base_url: "https://www.361api.com/v1"
    max_tokens: 4096
    temperature: 0.0

  # Lower-cost summarization model for compression
  361api-mini:
    name: openai-compatible
    model: gpt-4o-mini
    api_key: "${THREE_SIX_ONE_API_KEY}"
    api_key_env:
      - THREE_SIX_ONE_API_KEY
      - THREESIXONE_API_KEY
      - API_361_KEY
      - 361API_API_KEY
      - OPENAI_API_KEY
      - BLTCY_API_KEY
    base_url: "https://www.361api.com/v1"
    max_tokens: 2048
    temperature: 0.0

  # Legacy provider alias compatibility
  my-361api:
    name: openai-compatible
    model: gpt-4o
    api_key: "${THREE_SIX_ONE_API_KEY}"
    api_key_env:
      - THREE_SIX_ONE_API_KEY
      - THREESIXONE_API_KEY
      - API_361_KEY
      - 361API_API_KEY
      - OPENAI_API_KEY
      - BLTCY_API_KEY
    base_url: "https://www.361api.com/v1"
    max_tokens: 4096
    temperature: 0.0

  bltcy-anthropic:
    name: anthropic
    model: claude-sonnet-4-6
    api_key: "${BLTCY_API_KEY}"
    base_url: "https://api.bltcy.ai"
    max_tokens: 8192
    temperature: 0.0
    extra:
      thinking:
        enabled: true

  bltcy-openai:
    name: openai-compatible
    model: gpt-4o
    api_key: "${BLTCY_API_KEY}"
    base_url: "https://api.bltcy.ai/v1"
    max_tokens: 4096
    temperature: 0.0

  bltcy-mini:
    name: openai-compatible
    model: gpt-4o-mini
    api_key: "${BLTCY_API_KEY}"
    base_url: "https://api.bltcy.ai/v1"
    max_tokens: 2048
    temperature: 0.0

engine:
  max_rounds: 50

compression:
  token_window: 128000
  auto_trigger_ratio: 0.65
  micro_keep_recent: 6
  summary_provider: openai-hub-mini

storage:
  backend: sqlite
  path: ./harness.db

tools:
  enabled:
    - read_file
    - write_file
    - write_json
    - edit_file
    - search
    - shell
    - glob
    - grep
    - powershell
    - web_fetch
    - web_search
    - create_directory
    - list_dir
    - think
    - memory
    - todo_write
    - background_task
    - image_generate
    - image_edit
    - inspect_image
    - video_generate
    - hunyuan3d
    - run_init
    - design_bus_post
    - design_bus_read
    - research_fetch
    - research_asset_discover
    - research_asset_fetch
    - research_asset_validate
    - artifact_lint
    - export_package

  confirm_tools:
    - shell
    - powershell

  limits:
    read_file: 20000
    write_json: 12000
    search: 10000
    shell: 15000
    read_tool_output: 16000
    web_fetch: 8000
    web_search: 8000
    create_directory: 5000
    list_dir: 8000
    memory: 8000
    todo_write: 5000
    background_task: 8000
    image_generate: 8000
    image_edit: 8000
    inspect_image: 12000
    video_generate: 15000
    hunyuan3d: 12000
    run_init: 8000
    design_bus_post: 8000
    design_bus_read: 12000
    research_fetch: 12000
    research_asset_discover: 16000
    research_asset_fetch: 12000
    research_asset_validate: 12000
    artifact_lint: 16000
    export_package: 12000

mcp_servers: {}
